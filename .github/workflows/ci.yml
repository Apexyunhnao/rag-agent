name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # CI 注入固定的测试专用 secret（认证是 fail-closed 的，不配就起不来）
      AUTH_SECRET: ci-test-only-secret-not-a-real-key
      DEEPSEEK_API_KEY: ci-placeholder-unused-by-smoke-test
      # CI 不联网下载嵌入模型：健康检查与认证边界都不需要模型
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ⚠️ 这一步比较慢：锁文件里有 torch（sentence-transformers 的依赖）。
      #    公开仓库 Actions 免费时长无限，用时间换「与本地/Docker 完全一致的锁文件」。
      - name: 冷安装（锁文件）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 导入检查
        run: python -c "import main; print('import main OK')"

      - name: 启动 smoke（起服务 → 健康检查 → 未登录必须 401）
        run: |
          set -e
          python -m uvicorn main:app --host 127.0.0.1 --port 8002 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8002/health >/dev/null 2>&1 && break
            sleep 1
          done
          echo "health: $(curl -s http://127.0.0.1:8002/health)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8002/query \
                 -H 'Content-Type: application/json' -d '{"question":"ci smoke"}')
          echo "未登录查询 -> $code"
          test "$code" = "401"
